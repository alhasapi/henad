name: Release

# Builds installable binaries for every supported platform and attaches them to a
# GitHub release. Runs when a version tag is pushed (v0.1.0, v0.2.0, …) or manually
# from the Actions tab. Ordinary pushes never trigger it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    # One platform failing must not hide the binaries the others produced.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux — deb + AppImage + pacman
            args: --bundles deb,appimage
          - platform: windows-latest
            label: Windows — nsis installer + msi
            args: --bundles nsis,msi
          - platform: macos-latest
            label: macOS — dmg
            args: --bundles dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System dependencies (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release

      - run: npm ci

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Arch Linux package (pacman)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y libarchive-tools zstd
          version="${{ inputs.tag || github.ref_name }}"
          ./scripts/arch-package.sh "${version#v}"

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Henad ${{ inputs.tag || github.ref_name }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/arch/*.pkg.tar.zst
            src-tauri/target/release/bundle/rpm/*.rpm
